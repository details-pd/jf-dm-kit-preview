<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Every Great Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@10..48,75..100,200..800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=8">
</head>
<body>

  <!-- ============ INTRO: the game box (landing state) ============
       Redesign pending from Kharisel (bulked-up copy, dim background,
       bigger box). Keeping the approved unboxing until her mockup lands. -->
  <section id="intro" class="intro-overlay">
    <div class="game-box" id="gameBox">
      <div class="box-base" aria-hidden="true"></div>
      <div class="intro-card box-lid" id="introCard">
        <div class="intro-card-decor" aria-hidden="true">
          <span class="decor star">✦</span>
          <span class="decor heart">✦</span>
          <span class="decor star2">✦</span>
          <span class="decor cloud">✦</span>
        </div>
        <h1 id="introHeadline"></h1>
        <p class="intro-sub" id="introSub"></p>
        <button class="btn btn-primary" id="celebrateBtn"></button>
      </div>
    </div>
  </section>

  <!-- ============ STAGE: fixed camera viewport over the board ============
       The board (background art + slots + pawns) is built by main.js
       from KIT config; the camera moves the board inside this stage. -->
  <div id="stage" class="stage" aria-label="Game board">
    <div id="board" class="board"></div>
  </div>

  <!-- the deck stays pinned to the viewport -->
  <div class="deck-area" id="deckArea">
    <div class="speech-bubble" id="deckBubble"></div>
    <div class="deck" id="deck" role="button" tabindex="0" aria-label="Deck of memory cards">
      <div class="deck-card dc-3"></div>
      <div class="deck-card dc-2"></div>
      <div class="deck-card dc-1"></div>
      <div class="deck-card dc-top"></div>
    </div>
  </div>

  <!-- ============ CARD REVEAL POPUP (dimmed backdrop + X close) ============ -->
  <section id="reveal" class="reveal-overlay" aria-live="polite">
    <div class="reveal-card" id="revealCard">
      <div class="reveal-inner" id="revealInner">
        <div class="reveal-face reveal-back"></div>
        <div class="reveal-face reveal-front">
          <img id="revealImg" src="" alt="">
        </div>
      </div>
      <button class="reveal-close" id="revealClose" aria-label="Back to the board">✕</button>
    </div>
  </section>

  <!-- ============ GIFT SELECTION (flip cards, built from config) ============ -->
  <section id="giftSelect" class="giftselect-overlay">
    <div class="giftselect-stage">
      <h3 class="giftselect-title" id="giftTitle"></h3>
      <p class="giftselect-sub" id="giftSub"></p>
      <div class="gift-flip-row" id="giftRow"></div>
    </div>
  </section>

  <!-- ============ ADDRESS FORM ============ -->
  <section id="form" class="form-overlay">
    <div class="form-stamp-frame">
      <div class="form-scroll">
        <h3 class="form-title" id="formTitle"></h3>
        <p class="form-gift-line" id="formGiftLead">&nbsp;<strong id="chosenGiftLabel"></strong>
          <button type="button" class="link-btn" id="changeGiftBtn"></button></p>

        <form id="claimForm" novalidate>
          <!-- no Name field: the recipient is fixed by config -->
          <div class="field">
            <label for="fPhone" id="fPhoneLabel"></label>
            <input id="fPhone" name="phone" type="tel" autocomplete="tel" required>
          </div>
          <div class="field">
            <label for="fAddress" id="fAddressLabel"></label>
            <textarea id="fAddress" name="address" rows="3" autocomplete="street-address" required></textarea>
          </div>
          <p class="form-error" id="formError" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-wide" id="submitBtn"></button>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ THANK YOU ============ -->
  <section id="thanks" class="thanks-overlay">
    <div class="thanks-card">
      <h3 id="thanksTitle"></h3>
      <p id="thanksBody"></p>
      <button class="btn btn-secondary" id="exploreBtn"></button>
    </div>
  </section>

  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/main.js?v=11"></script>
</body>
</html>
